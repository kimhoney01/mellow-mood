<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>플레이리스트 만들기 · Mellow Mood</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23FFFFFF' width='32' height='32' rx='8'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23FFEEF3' stroke='%23C3D8B2' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-bar">
      <a class="logo" href="./"><img src="logo.png" alt="Mellow Mood" /></a>
    </header>

    <main class="stage">
      <section class="frame create-screen" aria-label="플레이리스트 생성">
        <div id="sticker-layer" class="sticker-layer is-editing"></div>
        <div class="title-banner" id="title-banner">
          <input
            id="playlist-title"
            class="title-input"
            type="text"
            placeholder="플레이리스트 제목"
            aria-label="플레이리스트 제목"
          />
          <label class="title-color">
            글씨 색
            <input id="title-color" type="color" value="#4B342C" />
            <span id="title-hex">#4B342C</span>
          </label>
        </div>

        <fieldset class="customizer" data-surface="banner">
          <legend>배너</legend>
          <div class="swatches" role="group" aria-label="배너 컬러">
            <button type="button" class="swatch" data-color="main" aria-pressed="false">
              <span class="swatch-color" style="background: #ffffff"></span>
              메인
            </button>
            <button type="button" class="swatch" data-color="sub" aria-pressed="true">
              <span class="swatch-color" style="background: #ffeef3"></span>
              서브
            </button>
            <button type="button" class="swatch" data-color="point" aria-pressed="false">
              <span class="swatch-color" style="background: #c3d8b2"></span>
              포인트
            </button>
          </div>
          <label class="file-button">
            파일
            <input type="file" accept="image/*" />
          </label>
          <input class="link-input" type="url" placeholder="이미지 링크" aria-label="배너 이미지 링크" />
          <button class="tool-button apply-link" type="button">적용</button>
          <p class="surface-note" hidden></p>
        </fieldset>

        <div class="addon-head">
          <button id="add-tag" class="create-button" type="button">태그 추가</button>
          <label class="mini-color">
            태그 색
            <input id="tag-color" type="color" value="#FFEEF3" />
            <span id="tag-hex">#FFEEF3</span>
          </label>
        </div>
        <form id="tag-form" class="entry-form" hidden>
          <input class="entry-input" type="text" name="tag" placeholder="태그" aria-label="태그" />
          <button class="tool-button" type="submit">추가</button>
          <p class="entry-note" hidden></p>
        </form>
        <ul id="tag-list" class="chip-list"></ul>

        <div class="addon-head">
          <button id="add-music" class="create-button" type="button">음악 링크 추가</button>
          <label class="mini-color">
            상자 색
            <input id="track-color" type="color" value="#FFFFFF" />
            <span id="track-hex">#FFFFFF</span>
          </label>
        </div>
        <form id="music-form" class="entry-form" hidden>
          <input class="entry-input" type="url" name="link" placeholder="유튜브 영상 링크" aria-label="유튜브 영상 링크" />
          <button class="tool-button" type="submit">추가</button>
          <p class="entry-note" hidden></p>
        </form>
        <ul id="music-list" class="link-list"></ul>

        <div class="addon-head">
          <label class="create-button sticker-add">
            스티커 추가
            <input id="sticker-file" type="file" accept="image/*" />
          </label>
          <p id="sticker-note" class="entry-note" hidden></p>
        </div>

        <div class="save-row">
          <p id="save-note" class="entry-note" hidden></p>
          <div class="save-actions">
            <button id="preview-playlist" class="preview-button" type="button">미리보기</button>
            <button id="save-playlist" class="save-button" type="button">저장</button>
          </div>
        </div>

        <fieldset class="customizer" data-surface="page">
          <legend>배경</legend>
          <div class="swatches" role="group" aria-label="배경 컬러">
            <button type="button" class="swatch" data-color="main" aria-pressed="true">
              <span class="swatch-color" style="background: #ffffff"></span>
              메인
            </button>
            <button type="button" class="swatch" data-color="sub" aria-pressed="false">
              <span class="swatch-color" style="background: #ffeef3"></span>
              서브
            </button>
            <button type="button" class="swatch" data-color="point" aria-pressed="false">
              <span class="swatch-color" style="background: #c3d8b2"></span>
              포인트
            </button>
          </div>
          <label class="file-button">
            파일
            <input type="file" accept="image/*" />
          </label>
          <input class="link-input" type="url" placeholder="이미지 링크" aria-label="배경 이미지 링크" />
          <button class="tool-button apply-link" type="button">적용</button>
          <p class="surface-note" hidden></p>
        </fieldset>
      </section>

      <section id="preview-screen" class="frame playlist-view" hidden aria-label="플레이리스트 미리보기">
        <div id="preview-sticker-layer" class="sticker-layer"></div>
        <div class="title-banner" id="preview-banner">
          <h1 class="playlist-title" id="preview-title">플레이리스트 제목</h1>
          <button id="close-preview" class="edit-button" type="button">닫기</button>
        </div>
        <ul id="preview-tags" class="chip-list"></ul>
        <ul id="preview-tracks" class="link-list"></ul>
      </section>
    </main>
    <script src="playlist-store.js"></script>
    <script src="stickers.js"></script>
    <script src="create.js"></script>
  </body>
</html>
