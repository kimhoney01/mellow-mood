<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인 · Mellow Mood</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23FFFFFF' width='32' height='32' rx='8'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23FFEEF3' stroke='%23C3D8B2' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-bar">
      <a class="logo" href="./"><img src="logo.png" alt="Mellow Mood" /></a>
    </header>
    <main class="stage">
      <section class="frame auth-screen" aria-label="로그인">
        <h1 class="auth-title">로그인</h1>
        <form id="login-form" class="auth-form">
          <label>
            이메일
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <label>
            비밀번호
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <p class="entry-note" hidden></p>
          <button class="save-button" type="submit">로그인</button>
        </form>
        <a id="signup-link" href="signup.html">회원가입</a>
      </section>
    </main>
    <script src="playlist-store.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
