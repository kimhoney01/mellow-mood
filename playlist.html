<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>플레이리스트 · Mellow Mood</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23FFFFFF' width='32' height='32' rx='8'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23FFEEF3' stroke='%23C3D8B2' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-bar">
      <a class="logo" href="./"><img src="logo.png" alt="Mellow Mood" /></a>
    </header>

    <main class="stage">
      <section class="frame playlist-view" aria-label="완성된 플레이리스트">
        <div id="sticker-layer" class="sticker-layer"></div>
        <div class="title-banner" id="title-banner">
          <h1 class="playlist-title" id="playlist-title">플레이리스트 제목</h1>
          <div class="banner-actions">
            <button id="share-playlist" class="edit-button" type="button" hidden>공유</button>
            <a class="edit-button" href="create.html?edit=1">Edit</a>
          </div>
        </div>
        <ul id="tag-list" class="chip-list"></ul>
        <ul id="music-list" class="link-list"></ul>
        <p id="share-note" class="entry-note" hidden></p>
        <p id="empty-note" class="entry-note" hidden></p>
      </section>
    </main>
    <script src="playlist-store.js"></script>
    <script src="stickers.js"></script>
    <script src="playlist.js"></script>
  </body>
</html>
